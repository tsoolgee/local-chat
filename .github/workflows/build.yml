name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run an end-to-end test with small models'
        type: boolean
        default: false
      image_model:
        description: 'Catalog id of the image model for the smoke test'
        type: string
        default: sd-turbo

env:
  # Pinned engine versions: bump deliberately, then test.
  LLAMA_TAG: b11552
  SD_TAG: master-956-1b0ba10
  SD_ASSET: sd-master-1b0ba10-bin-win-cpu-x64.zip

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch engines
        shell: pwsh
        run: |
          gh release download $env:LLAMA_TAG -R ggml-org/llama.cpp -p "llama-$env:LLAMA_TAG-bin-win-cpu-x64.zip" -O llama.zip
          gh release download $env:SD_TAG -R leejet/stable-diffusion.cpp -p $env:SD_ASSET -O sd.zip
          Expand-Archive llama.zip -DestinationPath llama
          Expand-Archive sd.zip -DestinationPath sd

      - name: Pack engines (they go inside the exe)
        shell: pwsh
        run: |
          $e = "pkg/engine"
          New-Item -ItemType Directory -Force "$e/sd" | Out-Null
          Copy-Item llama/llama-server.exe, llama/*.dll $e
          Copy-Item sd/sd-server.exe, sd/*.dll "$e/sd"
          Copy-Item llama/LICENSE* $e -ErrorAction SilentlyContinue
          Copy-Item sd/*.txt "$e/sd" -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $e), "$PWD/pkg/engine.zip", [IO.Compression.CompressionLevel]::Optimal, $false)
          "llama $env:LLAMA_TAG / sd $env:SD_TAG" | Set-Content -NoNewline -Encoding utf8 pkg/engine-version.txt
          "engine.zip: {0:N1} MB" -f ((Get-Item pkg/engine.zip).Length / 1MB)

      - name: Build LocalChat.exe
        run: dotnet build src/LocalChat.csproj -c Release -o out

      - name: Check
        shell: pwsh
        run: |
          "LocalChat.exe: {0:N1} MB" -f ((Get-Item out/LocalChat.exe).Length / 1MB)
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/LocalChat.exe release/

      - uses: actions/upload-artifact@v4
        with:
          name: LocalChat-exe
          path: release/LocalChat.exe
          retention-days: 14

      - name: Smoke test (small chat + image model)
        if: ${{ inputs.smoke_test }}
        shell: pwsh
        run: |
          # just the exe, in an empty Hebrew-named folder, like a real user would
          $root = Join-Path $env:RUNNER_TEMP "בדיקה\LocalChat"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item release/LocalChat.exe $root
          Start-Process "$root/LocalChat.exe" -ArgumentList "--no-window"
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$root/נתונים/port.txt"); $i++) { Start-Sleep 1 }
          Get-ChildItem $root -Recurse -Depth 1 | % { $_.FullName.Substring($root.Length) } | Select -First 20
          if (-not (Test-Path "$root/engine/llama-server.exe") -or -not (Test-Path "$root/engine/sd/sd-server.exe")) { "engines were not unpacked"; exit 1 }
          "engine version: " + (Get-Content "$root/engine/version.txt")
          $base = "http://localhost:47800/api"
          # models come in through the app's own downloader
          $imgId = "${{ inputs.image_model }}"
          irm "$base/download" -Method Post -ContentType 'application/json' -Body (@{ url = 'https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/blob/main/SmolLM2-360M-Instruct-Q8_0.gguf'; kind = 'chat' } | ConvertTo-Json)
          irm "$base/download" -Method Post -ContentType 'application/json' -Body (@{ id = $imgId } | ConvertTo-Json)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          do { Start-Sleep 5; $d = irm "$base/downloads"; ($d | % { "{0} {1} {2:N0}MB/{3:N0}MB" -f $_.name, $_.state, ($_.done/1MB), ($_.total/1MB) }) -join ' | ' } while (($d | ? { $_.state -in 'queued','downloading' }) -and $sw.Elapsed.TotalMinutes -lt 30)
          if ($d | ? { $_.state -ne 'done' }) { $d | ConvertTo-Json; exit 1 }
          "downloads finished in $([int]$sw.Elapsed.TotalSeconds)s"
          $imgPath = ($d | ? { $_.id -eq $imgId }).path
          irm "$base/load" -Method Post -ContentType 'application/json' -Body '{"file":"SmolLM2-360M-Instruct-Q8_0.gguf","ctx":4096}'
          irm "$base/models" | ConvertTo-Json -Compress
          irm "$base/image-models" | ConvertTo-Json -Compress
          for ($i = 0; $i -lt 60; $i++) { $s = irm "$base/state"; if ($s.state -eq 'ready') { break }; Start-Sleep 2 }
          "chat engine: $($s.state) $($s.error)"
          $chat = @{ messages = @(@{ role = 'user'; content = 'Say hi in five words.' }); max_tokens = 30 } | ConvertTo-Json -Depth 5
          (irm "http://127.0.0.1:$($s.port)/v1/chat/completions" -Method Post -Body $chat -ContentType 'application/json').choices[0].message.content
          "image model: $imgPath"
          irm "$base/image-load" -Method Post -Body (@{ file = $imgPath } | ConvertTo-Json) -ContentType 'application/json; charset=utf-8'
          for ($i = 0; $i -lt 300; $i++) { $s = irm "$base/state"; if ($s.image.state -ne 'loading') { break }; Start-Sleep 2 }
          "image engine: $($s.image.state) $($s.image.error)"
          if ($s.image.state -ne 'ready') { irm "$base/image-log"; exit 1 }
          $req = @{ prompt = 'a red apple on a wooden table, photo'; width = 512; height = 512; seed = -1; batch_count = 1;
                    sample_params = @{ sample_steps = $(if ($imgId -like 'z-image*') { 4 } else { 1 }); guidance = @{ txt_cfg = 1 } }; preview = 'proj'; output_format = 'png' } | ConvertTo-Json -Depth 5
          $job = irm "$base/img/generate" -Method Post -Body $req -ContentType 'application/json'
          "job: $($job.id)"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          do { Start-Sleep 1; $j = irm "$base/img/job/$($job.id)"; "  $($j.status) $($j.preview.step)/$($j.preview.total_steps)" } while ($j.status -in 'queued','generating' -and $sw.Elapsed.TotalMinutes -lt 40)
          $j | ConvertTo-Json -Depth 4 -Compress
          if ($j.status -ne 'completed') { irm "$base/image-log"; exit 1 }
          irm "$base/image-log" | Select-String -Pattern 'version|--diffusion|--llm|--vae' | Select -First 12
          New-Item -ItemType Directory -Force smoke | Out-Null
          Invoke-WebRequest "http://localhost:47800$($j.images[0])" -OutFile smoke/result.png
          "generated in $([int]$sw.Elapsed.TotalSeconds)s"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.smoke_test }}
        with:
          name: smoke-result
          path: smoke/
